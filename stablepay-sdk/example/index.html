<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Brand assets. Sources of truth live in /brand; the copies in public/
      are what Vite serves. Regenerate with brand/scripts/generate-rasters.py
      and re-copy rather than editing these by hand.

      Order matters: browsers that understand SVG favicons take the first
      match and ignore the rest.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#235EFE" />

    <title>Demo Shop &middot; StablePay</title>
    <meta
      name="description"
      content="A demo merchant site with the StablePay widget embedded."
    />

    <meta property="og:title" content="Demo Shop &middot; StablePay" />
    <meta
      property="og:description"
      content="A demo merchant site with the StablePay widget embedded."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
