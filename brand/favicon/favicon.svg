<!--
  Square-cropped mark for use as a modern SVG favicon.

  The viewBox is shifted up by 16.5 units rather than moving the circles, so
  the geometry stays byte-identical to logo/stablepay-logo.svg and a diff
  between the two shows only the framing.

  Wire it up ahead of the .ico so supporting browsers prefer the vector:
      <link rel="icon" href="/favicon.svg" type="image/svg+xml">
      <link rel="icon" href="/favicon.ico" sizes="32x32">
-->
<svg width="582" height="582" viewBox="0 -16.5 582 582" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StablePay">
  <title>StablePay</title>
  <circle cx="290.5" cy="170.5" r="170.5" fill="white"/>
  <circle cx="411.5" cy="378.5" r="170.5" fill="white"/>
  <circle cx="170.5" cy="378.5" r="170.5" fill="white"/>
  <circle opacity="0.7" cx="290.5" cy="170.5" r="170.5" fill="#235EFE"/>
  <circle opacity="0.8" cx="170.5" cy="378.5" r="170.5" fill="#FFC822"/>
  <circle opacity="0.8" cx="411.5" cy="378.5" r="170.5" fill="#FD6724"/>
</svg>
