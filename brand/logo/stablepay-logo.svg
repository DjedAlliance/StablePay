<!--
  StablePay primary logo.

  Three overlapping discs. Each colour disc is painted at partial opacity over
  an opaque white disc, so the overlaps mix into secondary hues. The white
  underlay is part of the mark, not a background: it is what keeps the colours
  true when the logo is placed on a coloured surface.

  Do not remove the white circles to "make it transparent". Use
  stablepay-logo-mono.svg instead.
-->
<svg width="582" height="549" viewBox="0 0 582 549" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StablePay">
  <title>StablePay</title>

  <!-- Opaque underlay, so the tints below never pick up the page colour. -->
  <circle cx="290.5" cy="170.5" r="170.5" fill="white"/>
  <circle cx="411.5" cy="378.5" r="170.5" fill="white"/>
  <circle cx="170.5" cy="378.5" r="170.5" fill="white"/>

  <!-- Brand hues. Paint order matters: blue, then yellow, then orange. -->
  <circle opacity="0.7" cx="290.5" cy="170.5" r="170.5" fill="#235EFE"/>
  <circle opacity="0.8" cx="170.5" cy="378.5" r="170.5" fill="#FFC822"/>
  <circle opacity="0.8" cx="411.5" cy="378.5" r="170.5" fill="#FD6724"/>
</svg>
